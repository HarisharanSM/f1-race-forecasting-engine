[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f1-race-forecasting-engine"
version = "0.1.0"
description = "Evidence-grounded F1 scenario forecasts with closed-loop learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pydantic>=2.10,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
ml = ["torch>=2.6,<3"]
llm = ["openai>=1.68,<3"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
f1-forecast = "f1_forecast.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
